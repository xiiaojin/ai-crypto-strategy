<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>AI 策略助手</title>
    <script>
      function getStrategy() {
        var coin = document.getElementById('coin').value; // 获取输入的币种
        if (coin.toLowerCase() === "eth") {
          alert("策略已获取：ETH");
          // 在这里可以添加实际的策略获取代码
        } else {
          alert("请输入有效的币种");
        }
      }
    </script>
  </head>
  <body>
    <h1>欢迎来到你的 AI 策略网站！</h1>
    <p>部署成功！后续我们可以集成币圈预测和策略。</p>
    
    <label for="coin">输入币种（例如 ETH）：</label>
    <input type="text" id="coin" placeholder="ETH">
    
    <button onclick="getStrategy()">获取策略</button>
  </body>
</html>
